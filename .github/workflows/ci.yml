name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel main: a newer push must not interrupt a release mid-publish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static:
    # Lint, secret, layer, dependency, docs and type checks. None depends on the Node runtime, so
    # they run once, on the engines floor.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.1'
          cache: npm
      # No dependency needs an install script on Linux.
      - run: npm ci --ignore-scripts
      - run: npm run check:static

  runtime:
    # Tests, build and the packed consumer: a dts/entry-point regression must fail on the PR, not
    # for the first time on the release.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The engines floor, the latest of its line, and the active LTS.
        node: ['24.13.1', '24.x', '26.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # No dependency needs an install script on Linux.
      - run: npm ci --ignore-scripts
      - run: npm run check:runtime

  release:
    # Publishes package.json's version once both check jobs pass on main, through npm trusted
    # publishing (no stored token; provenance included), then tags it and creates the GitHub
    # release from its CHANGELOG section. A version already on npm is not republished, so pushes
    # that do not raise the version only fill in a missing tag or release.
    needs: [static, runtime]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted publishing needs npm 11.5.1 or later, which Node 24.x bundles.
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci --ignore-scripts
      - id: package
        name: Read the version and its release notes
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          awk -v heading="## [$version] - " '
            index($0, heading) == 1 { found = 1; next }
            found && (/^## / || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no dated '## [$version] - YYYY-MM-DD' section"
            exit 1
          fi
          if published=$(npm view "$name@$version" version 2> "$RUNNER_TEMP/view.err"); then
            [ -n "$published" ] && echo "published=true" >> "$GITHUB_OUTPUT"
          elif ! grep -q E404 "$RUNNER_TEMP/view.err"; then
            cat "$RUNNER_TEMP/view.err" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish to npm
        if: steps.package.outputs.published != 'true'
        # The check jobs above already ran `npm run check`; skip prepublishOnly and build once.
        run: |
          npm run build
          npm publish --ignore-scripts
      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.package.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG already released"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
